services:
  app:
    build:
      context: ..
      dockerfile: self-hosted/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8787
      - HOST=0.0.0.0
      - DATABASE_PATH=/data/hundefutter.db
      - PUBLIC_DIR=/app/public
      - COOKIE_SECURE=1
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - TIMEZONE=${TIMEZONE:-Europe/Berlin}
    volumes:
      - appdata:/data
    expose:
      - "8787"
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app
    networks:
      - web

volumes:
  appdata:
  caddydata:
  caddyconfig:

networks:
  web:
